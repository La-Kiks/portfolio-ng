<nav class="bento-card w-full px-5 py-3 md:px-6 md:py-4">
    <div class="navbar-row flex flex-wrap items-center justify-between gap-4">
        <a routerLink="/" class="navbar-title">{{ title() }}</a>
        <div class="navbar-items flex items-center gap-2.5">
            @for (item of navItems(); track item.id) {
            @if (item.current) {
            <span class="navbar-button navbar-button-current" aria-current="page">{{ item.label }}</span>
            } @else {
            <button type="button" (click)="item.action?.()" class="navbar-button"
                [class.navbar-button-primary]="item.primary">
                {{ item.label }}
            </button>
            }
            }
        </div>
    </div>
</nav>
