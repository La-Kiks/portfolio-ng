<nav class="bento-card w-full px-5 py-3 md:px-6 md:py-4">
    <div class="flex flex-wrap items-center justify-between gap-4">
        <p class="navbar-title">{{ title() }}</p>
        <div class="flex items-center gap-2.5">
            @for (item of navItems(); track item.id) {
            <button type="button" (click)="item.action?.()" class="navbar-button"
                [class.navbar-button-primary]="item.primary">
                {{ item.label }}
            </button>
            }
        </div>
    </div>
</nav>
