<nav class="social-grid" aria-label="Me contacter">
    @for (link of socialLinks(); track link.label; let first = $first) {
    <a [href]="link.url" [attr.target]="isExternal(link) ? '_blank' : null"
        [attr.rel]="isExternal(link) ? 'noopener noreferrer' : null" class="social-link"
        [class.bento-card]="!first" [class.bento-card-ink]="first">
        <span class="social-label">
            <i [ngClass]="link.icon" class="text-2xl" aria-hidden="true"></i>
            {{ link.label }}
        </span>
        <i class="fa-solid fa-arrow-right -rotate-45" aria-hidden="true"></i>
    </a>
    }
</nav>
